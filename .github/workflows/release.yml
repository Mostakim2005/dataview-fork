name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare Obsidian plugin files
        shell: bash
        run: |
          set -euo pipefail

          test -s build/main.js
          test -s manifest.json

          cp build/main.js main.js

          # Dataview already keeps styles.css at the repository root.
          test -s styles.css

      - name: Validate plugin files
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css

          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));

          if (!manifest.id) throw new Error("manifest.json is missing id");
          if (!manifest.version) throw new Error("manifest.json is missing version");

          console.log(`Plugin: ${manifest.name || manifest.id}`);
          console.log(`Version: ${manifest.version}`);
          NODE

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          gh release create "$tag" \
            main.js \
            manifest.json \
            styles.css \
            --verify-tag \
            --title "Dataview ${tag#v}" \
            --generate-notes
