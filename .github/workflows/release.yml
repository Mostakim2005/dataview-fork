name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production plugin
        run: npm run build:prod

      - name: Prepare Obsidian plugin files
        shell: bash
        run: |
          set -euo pipefail

          # The production Rollup config outputs main.js to the repository root.
          test -s main.js
          test -s manifest.json

          if [ -s styles.css ]; then
            echo "styles.css found."
          else
            echo "No styles.css in this plugin; continuing without it."
          fi

      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));

          if (!manifest.id) throw new Error("manifest.json is missing id");
          if (!manifest.version) throw new Error("manifest.json is missing version");

          console.log(`Plugin: ${manifest.name || manifest.id}`);
          console.log(`Version: ${manifest.version}`);
          NODE

      - name: Upload assets to existing or new release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          assets=(main.js manifest.json)

          if [ -s styles.css ]; then
            assets+=(styles.css)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; replacing plugin assets."
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            echo "Creating release $tag."
            gh release create "$tag" \
              "${assets[@]}" \
              --verify-tag \
              --title "Dataview ${tag#v}" \
              --generate-notes
          fi

  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install mkdocs-material mkdocs-redirects

      - name: Deploy documentation
        working-directory: docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          mkdocs gh-deploy --force
